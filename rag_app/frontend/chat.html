<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Document Chat</title>
<style>
  :root {
    --bg:#0d0f16; --panel:#171a24; --border:#252938;
    --accent:#6c8cff; --accent-soft:#2a3350;
    --amber:#e8b45a; --amber-dim:#3a3220;
    --text:#e6e8ef; --muted:#8b90a3;
    --user:#2a3350; --bot:#1d212e;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    height:100vh; display:flex; flex-direction:column;
  }
  .serif { font-family:Georgia,"Times New Roman",serif; }

  header {
    padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .meta { font-size:12px; color:var(--muted); white-space:nowrap; }
  header a { color:var(--accent); text-decoration:none; font-size:13px; }
  header a:hover { text-decoration:underline; }

  #chat { flex:1; overflow-y:auto; padding:24px; max-width:820px; width:100%; margin:0 auto; }

  /* --- Welcome hero ---------------------------------------------------- */
  #hero { margin:8vh auto 0; max-width:600px; text-align:center; animation:rise .6s ease both; }
  #hero .hello {
    font-size:clamp(30px,5vw,42px); line-height:1.2; margin:0 0 14px; font-weight:400;
  }
  #hero .hello em { font-style:italic; color:var(--accent); }
  #hero .sub { color:var(--muted); font-size:15px; line-height:1.65; margin:0 0 8px; }
  #hero .sub a { color:var(--accent); text-decoration:none; }
  #hero .sub a:hover { text-decoration:underline; }
  #hero .docline { font-size:13px; color:var(--muted); margin:18px 0 6px; }
  #hero .docline strong { color:var(--text); font-weight:600; }
  .starters { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; }
  .starter {
    background:transparent; border:1px solid var(--border); color:var(--text);
    border-radius:999px; padding:8px 16px; font-size:13px; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .starter:hover, .starter:focus-visible { border-color:var(--accent); background:var(--accent-soft); }

  /* --- Messages ---------------------------------------------------------- */
  .msg { margin:14px 0; display:flex; gap:10px; animation:rise .25s ease both; }
  .msg .bubble {
    padding:12px 16px; border-radius:12px; line-height:1.55;
    white-space:pre-wrap; max-width:85%;
  }
  .msg.user { justify-content:flex-end; }
  .msg.user .bubble { background:var(--user); }
  .msg.bot .bubble { background:var(--bot); border:1px solid var(--border); }
  .sources { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .source-chip {
    font-size:11px; color:var(--amber); background:var(--amber-dim);
    border-radius:6px; padding:2px 8px;
  }

  /* --- Composer ----------------------------------------------------------- */
  form {
    display:flex; gap:10px; padding:16px 24px; background:var(--panel);
    border-top:1px solid var(--border); max-width:820px; width:100%; margin:0 auto;
  }
  input[type=text] {
    flex:1; padding:12px 14px; border-radius:10px; border:1px solid #333;
    background:#11131c; color:var(--text); font-size:15px;
  }
  input[type=text]:focus-visible, .starter:focus-visible, button:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px;
  }
  button[type=submit] {
    padding:12px 20px; border:none; border-radius:10px; background:var(--accent);
    color:#fff; font-weight:600; cursor:pointer; font-size:15px;
  }
  button:disabled { opacity:.5; cursor:not-allowed; }

  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) {
    #hero, .msg { animation:none; }
    .starter { transition:none; }
  }
</style>
</head>
<body>
<header>
  <h1>💬 Document Chat</h1>
  <div class="meta"><span id="docinfo">Loading…</span> &nbsp;·&nbsp; <a href="/about">About</a> &nbsp;·&nbsp; <a href="/admin">Admin</a></div>
</header>

<div id="chat">
  <div id="hero">
    <h2 class="hello serif">Welcome
    <p class="sub">
      Ask a question and this app finds the most relevant passages in the uploaded
      documents, then answers from them — with the sources cited under every reply.
      Curious how? <a href="/about">See the pipeline</a>.
    </p>
    <p class="docline" id="docline">Checking the library…</p>
    <div class="starters" id="starters" hidden>
      <button type="button" class="starter">What topics do these documents cover?</button>
      <button type="button" class="starter">Summarize the key points</button>
      <button type="button" class="starter">What should I read first?</button>
    </div>
  </div>
</div>

<form id="form">
  <input type="text" id="input" placeholder="Ask a question…" autocomplete="off" />
  <button type="submit" id="send">Send</button>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

async function loadStatus() {
  const info = document.getElementById('docinfo');
  const docline = document.getElementById('docline');
  const starters = document.getElementById('starters');
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    if (d.documents.length) {
      info.textContent = `${d.documents.length} document(s) loaded`;
      const names = d.documents.join(', ');
      docline.innerHTML = `<strong>${d.documents.length}</strong> document${d.documents.length > 1 ? 's' : ''} in the library: ${names}`;
      starters.hidden = false;
    } else {
      info.textContent = 'No documents yet';
      docline.textContent = 'The library is empty right now — an admin can add documents on the Admin page.';
    }
  } catch {
    info.textContent = 'offline';
    docline.textContent = 'Could not reach the server.';
  }
}

function addSources(bubble, sources) {
  if (!sources || !sources.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'sources';
  for (const s of sources) {
    const chip = document.createElement('span');
    chip.className = 'source-chip';
    chip.textContent = s;
    wrap.appendChild(chip);
  }
  bubble.appendChild(wrap);
}

function addMsg(role, text) {
  const hero = document.getElementById('hero');
  if (hero) hero.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

async function ask(q) {
  addMsg('user', q);
  input.value = '';
  sendBtn.disabled = true;
  const thinking = addMsg('bot', 'Searching the documents…');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: q }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Something went wrong — try again.');
    thinking.textContent = d.answer;
    addSources(thinking, d.sources);
  } catch (err) {
    thinking.textContent = '⚠️ ' + err.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (q) ask(q);
});

document.getElementById('starters').addEventListener('click', (e) => {
  const btn = e.target.closest('.starter');
  if (btn) ask(btn.textContent);
});

loadStatus();
</script>
</body>
</html>
