<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Document Chat</title>
<style>
  :root { --bg:#0f1117; --panel:#1a1d27; --accent:#6c8cff; --text:#e6e8ef; --muted:#8b90a3; --user:#2a3350; --bot:#232735; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; background:var(--panel); border-bottom:1px solid #262a38; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .meta { font-size:12px; color:var(--muted); }
  header a { color:var(--accent); text-decoration:none; font-size:13px; }
  #chat { flex:1; overflow-y:auto; padding:24px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin:14px 0; display:flex; gap:10px; }
  .msg .bubble { padding:12px 16px; border-radius:12px; line-height:1.5; white-space:pre-wrap; max-width:85%; }
  .msg.user { justify-content:flex-end; }
  .msg.user .bubble { background:var(--user); }
  .msg.bot .bubble { background:var(--bot); }
  .sources { font-size:11px; color:var(--muted); margin-top:6px; }
  .empty { color:var(--muted); text-align:center; margin-top:40px; }
  form { display:flex; gap:10px; padding:16px 24px; background:var(--panel); border-top:1px solid #262a38; max-width:820px; width:100%; margin:0 auto; }
  input[type=text] { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #333; background:#12141c; color:var(--text); font-size:15px; }
  button { padding:12px 20px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:15px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <h1>💬 Document Chat</h1>
  <div class="meta"><span id="docinfo">Loading…</span> &nbsp;·&nbsp; <a href="/about">About</a> &nbsp;·&nbsp; <a href="/admin">Admin</a></div>
</header>
<div id="chat"><div class="empty" id="empty">Ask anything about the uploaded documents.</div></div>
<form id="form">
  <input type="text" id="input" placeholder="Ask a question…" autocomplete="off" />
  <button type="submit" id="send">Send</button>
</form>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

async function loadStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const info = document.getElementById('docinfo');
    info.textContent = d.documents.length
      ? `${d.documents.length} document(s) loaded`
      : 'No documents yet';
  } catch { document.getElementById('docinfo').textContent = 'offline'; }
}

function addMsg(role, text, sources) {
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'sources';
    s.textContent = 'Sources: ' + sources.join(', ');
    bubble.appendChild(s);
  }
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  addMsg('user', q);
  input.value = '';
  sendBtn.disabled = true;
  const thinking = addMsg('bot', 'Thinking…');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: q }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Error');
    thinking.textContent = d.answer;
    if (d.sources && d.sources.length) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.textContent = 'Sources: ' + d.sources.join(', ');
      thinking.appendChild(s);
    }
  } catch (err) {
    thinking.textContent = '⚠️ ' + err.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

loadStatus();
</script>
</body>
</html>
